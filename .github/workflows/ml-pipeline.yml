name: InsightCart Local ML Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'data/**'
      - 'artifacts/**'
      - 'requirements.txt'
      - '.github/workflows/ml-pipeline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'data/**'
      - 'artifacts/**'
      - 'requirements.txt'
      - '.github/workflows/ml-pipeline.yml'
  workflow_dispatch:

jobs:
  local-ml-pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
      MLFLOW_TRACING_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore local DVC artifacts if present
        run: |
          if [ -d ../dvc_storage ]; then
            dvc remote list
            dvc pull -r localstorage || echo 'Local DVC remote is configured but artifact pull is unavailable; continuing with local workspace data.'
          else
            echo 'No local DVC remote found at ../dvc_storage; continuing with repository artifacts if present.'
          fi

      - name: Run Flake8
        run: |
          flake8 app src tests

      - name: Run tests
        run: |
          pytest -q

      - name: Run local training pipeline if the repository artifacts are available
        run: |
          if [ -f src/pipeline/review_detection_training_pipeline.py ]; then
            python src/pipeline/review_detection_training_pipeline.py
          else
            echo 'Training pipeline script not present; local CI validation completed.'
          fi
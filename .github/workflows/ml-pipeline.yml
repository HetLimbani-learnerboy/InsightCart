name: InsightCart ML Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "artifacts/**"
      - ".dvc/config"
      - "dvc.yaml"
      - "dvc.lock"
      - "requirements.txt"
      - ".github/workflows/ml-pipeline.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "artifacts/**"
      - ".dvc/config"
      - "dvc.yaml"
      - "dvc.lock"
      - "requirements.txt"
      - ".github/workflows/ml-pipeline.yml"

  workflow_dispatch:
    inputs:
      run_training:
        description: "Run the model training pipeline"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: insightcart-ml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ML Pipeline
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./test.db
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
      MLFLOW_TRACING_ENABLED: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Check training script
        run: |
          test -f src/pipeline/review_detection_training_pipeline.py

      - name: Run Flake8
        run: |
          flake8 app src tests

      - name: Run tests
        run: |
          pytest -q

  train:
    name: Train and Evaluate Candidate
    runs-on: ubuntu-latest
    needs: validate

    # Train on pushes to configured branches, or when explicitly
    # requested through workflow_dispatch.
    # Pull requests validate the code but do not train.
    if: >-
      ${{
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.run_training == true
        )
      }}

    env:
      DATABASE_URL: sqlite:///./test.db
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
      MLFLOW_TRACING_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
      DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify DVC installation
        run: |
          dvc --version

      - name: Validate DVC remote configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DVC_REMOTE_URL:-}" ]]; then
            echo "::error::DVC_REMOTE_URL repository secret is missing."
            echo "Configure it with the URL of your accessible DVC remote."
            exit 1
          fi

          echo "DVC remote URL is configured."

      - name: Configure accessible DVC remote
        shell: bash
        run: |
          set -euo pipefail

          # Override the machine-local default for this runner only.
          # This does not modify the checked-in .dvc/config file.
          dvc remote add \
            --local \
            --force \
            --default \
            github-storage \
            "$DVC_REMOTE_URL"

          dvc remote list

      # Authenticate with your storage provider before this step.
      # For a private remote, configure the required provider credentials
      # or workload identity in GitHub Actions.
      - name: Pull required DVC artifacts
        run: |
          set -euo pipefail

          dvc pull \
            data/raw/fake_reviews_dataset.csv.dvc \
            artifacts/models/best_linear_svm_calibrated.pkl.dvc \
            artifacts/models/category_encoder.pkl.dvc \
            artifacts/models/tfidf_vectorizer.pkl.dvc

          test -s data/raw/fake_reviews_dataset.csv

          echo "Dataset retrieved successfully."

      - name: Verify required model artifacts
        run: |
          set -euo pipefail

          test -s artifacts/models/best_linear_svm_calibrated.pkl
          test -s artifacts/models/category_encoder.pkl
          test -s artifacts/models/tfidf_vectorizer.pkl

          echo "Required model artifacts are available."

      - name: Run existing training pipeline
        run: |
          set -euo pipefail

          python src/pipeline/review_detection_training_pipeline.py

      - name: Check for evaluation results
        if: always()
        run: |
          echo "Checking for generated evaluation results..."

          if [ -f data/processed/model_comparison.csv ]; then
            echo "Model comparison file exists."
          else
            echo "::warning::No model_comparison.csv was generated."
          fi

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insightcart-ml-results-${{ github.run_id }}
          path: |
            data/processed/model_comparison.csv
            artifacts/experiments/dvc-candidate/
            mlruns/
          if-no-files-found: warn
          retention-days: 14
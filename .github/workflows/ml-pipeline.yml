name: InsightCart ML Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc-s3

      - name: Configure AWS Credentials on Runner
        run: |
          mkdir -p ~/.aws
          cat <<EOF > ~/.aws/credentials
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF

          cat <<EOF > ~/.aws/config
          [default]
          region = ap-south-1
          output = json
          EOF

      - name: Verify S3 Connection
        run: |
          aws s3 ls s3://insightcart-mlops-dvc-2026/

      - name: Run Flake8
        run: |
          flake8 app src

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///./test.db' }}
        run: |
          pytest -v

      - name: Pull DVC dataset
        run: |
          dvc pull

      - name: Run InsightCart Training Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///./test.db' }}
        run: |
          python src/pipeline/review_detection_training_pipeline.py

      - name: Show evaluation metrics
        run: |
          cat artifacts/evaluation_results.json

      - name: Show model comparison
        run: |
          cat data/processed/model_comparison.csv
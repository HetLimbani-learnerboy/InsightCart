name: InsightCart ML Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "artifacts/**"
      - ".dvc/config"
      - "dvc.yaml"
      - "dvc.lock"
      - "requirements.txt"
      - ".github/workflows/ml-pipeline.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "artifacts/**"
      - ".dvc/config"
      - "dvc.yaml"
      - "dvc.lock"
      - "requirements.txt"
      - ".github/workflows/ml-pipeline.yml"

  workflow_dispatch:
    inputs:
      run_training:
        description: "Run the model training pipeline"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: insightcart-ml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ML Pipeline
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./test.db
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
      MLFLOW_TRACING_ENABLED: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]" flake8

      - name: Check training script
        run: |
          test -f src/pipeline/review_detection_training_pipeline.py

      - name: Run Flake8
        run: |
          flake8 app src tests

      - name: Run tests
        run: |
          pytest -q

  train:
    name: Train and Evaluate Candidate
    runs-on: ubuntu-latest
    needs: validate

    if: >-
      ${{
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.run_training == true
        )
      }}

    env:
      DATABASE_URL: sqlite:///./test.db
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
      MLFLOW_TRACING_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
      DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]"

      - name: Verify DVC installation
        run: |
          dvc --version

      - name: Validate AWS and DVC configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DVC_REMOTE_URL:-}" ]]; then
            echo "::error::DVC_REMOTE_URL secret is missing."
            exit 1
          fi

          echo "DVC remote URL is configured."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify AWS authentication
        run: |
          aws sts get-caller-identity

      - name: Verify S3 bucket access
        run: |
          aws s3 ls "$DVC_REMOTE_URL"

      - name: Configure DVC remote
        shell: bash
        run: |
          set -euo pipefail

          dvc remote add \
            --local \
            --force \
            --default \
            storage \
            "$DVC_REMOTE_URL"

          dvc remote list

      - name: Pull required DVC artifacts
        shell: bash
        run: |
          set -euo pipefail

          dvc pull \
            data/raw/fake_reviews_dataset.csv.dvc \
            artifacts/models/best_linear_svm_calibrated.pkl.dvc \
            artifacts/models/category_encoder.pkl.dvc \
            artifacts/models/tfidf_vectorizer.pkl.dvc

          test -s data/raw/fake_reviews_dataset.csv

          echo "Dataset retrieved successfully."

      - name: Verify required model artifacts
        run: |
          set -euo pipefail

          test -s artifacts/models/best_linear_svm_calibrated.pkl
          test -s artifacts/models/category_encoder.pkl
          test -s artifacts/models/tfidf_vectorizer.pkl

          echo "Required model artifacts are available."

      - name: Train candidate
        run: |
          set -euo pipefail

          python src/pipeline/review_detection_training_pipeline.py \
            --output-dir artifacts/experiments/dvc-candidate

      - name: Validate mandatory experiment outputs
        run: |
          set -euo pipefail
          output=artifacts/experiments/dvc-candidate
          test -s "$output/model_comparison.csv"
          test -s "$output/evaluation_results.json"
          test -s "$output/model_metadata.json"
          test -s "$output/promotion_decision.json"
          test -s "$output/selected_model.pkl"
          test -s "$output/preprocessing/tfidf_vectorizer.pkl"
          test -s "$output/preprocessing/category_encoder.pkl"
          test -s "$output/preprocessing/rating_scaler.pkl"
          python -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p)); assert all(k in d for k in ("f1", "selected_model", "dataset_version"))' "$output/evaluation_results.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("experiment_id") and d.get("candidate_artifact_sha256")' "$output/model_metadata.json"
          python -c 'import pandas as pd,sys; d=pd.read_csv(sys.argv[1]); assert len(d) and {"algorithm","training_status","validation_f1"}.issubset(d.columns)' "$output/model_comparison.csv"
          python -c 'import joblib,sys; b=joblib.load(sys.argv[1]); assert b.get("model") is not None' "$output/selected_model.pkl"

      - name: Upload evaluation results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: insightcart-ml-results-${{ github.run_id }}
          path: |
            artifacts/experiments/dvc-candidate/
            mlruns/
          if-no-files-found: error
          retention-days: 14

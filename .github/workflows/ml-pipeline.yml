name: InsightCart ML Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "artifacts/**"
      - "dvc.yaml"
      - "dvc.lock"
      - "requirements.txt"
      - ".github/workflows/ml-pipeline.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "artifacts/**"
      - "dvc.yaml"
      - "dvc.lock"
      - "requirements.txt"
      - ".github/workflows/ml-pipeline.yml"

  workflow_dispatch:
    inputs:
      run_training:
        description: "Run the model training pipeline"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate ML Pipeline
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./test.db
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
      MLFLOW_TRACING_ENABLED: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run Flake8
        run: |
          flake8 app src tests

      - name: Run tests
        run: |
          pytest -q

      - name: Validate training pipeline script
        run: |
          if [ -f src/pipeline/review_detection_training_pipeline.py ]; then
            echo "Training pipeline script found."
          else
            echo "::error::Expected training pipeline script was not found."
            exit 1
          fi

  train:
    name: Train Model
    runs-on: ubuntu-latest
    needs: validate

    if: >-
      ${{
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.run_training == true
        )
      }}

    env:
      DATABASE_URL: sqlite:///./test.db
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
      MLFLOW_TRACING_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
      DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DVC remote
        run: |
          if [ -z "$DVC_REMOTE_URL" ]; then
            echo "::error::DVC_REMOTE_URL repository secret is required for hosted training."
            echo "The checked-in DVC remote is a machine-local path and cannot be reached by GitHub-hosted runners."
            exit 1
          fi
          dvc remote modify --local localstorage url "$DVC_REMOTE_URL"

      - name: Pull the requested dataset version
        run: |
          dvc pull \
            data/raw/fake_reviews_dataset.csv.dvc \
            artifacts/models/best_linear_svm_calibrated.pkl.dvc \
            artifacts/models/category_encoder.pkl.dvc \
            artifacts/models/tfidf_vectorizer.pkl.dvc \
            artifacts/models/rating_scaler.pkl.dvc
          test -s data/raw/fake_reviews_dataset.csv
          test -s artifacts/models/rating_scaler.pkl

      - name: Reproduce candidate pipeline
        run: |
          dvc repro train_candidate

      - name: Upload candidate evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insightcart-dvc-candidate
          path: artifacts/experiments/dvc-candidate/
          if-no-files-found: warn
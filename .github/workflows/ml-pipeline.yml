name: InsightCart ML Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc-s3

      - name: Configure AWS Credentials on Runner
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          cat <<EOF > ~/.aws/credentials
          [default]
          aws_access_key_id = $AWS_KEY
          aws_secret_access_key = $AWS_SECRET
          EOF

          cat <<EOF > ~/.aws/config
          [default]
          region = ap-south-1
          output = json
          EOF

      - name: Pull DVC Raw Data
        run: |
          dvc pull data/raw/fake_reviews_dataset.csv.dvc || dvc pull data/raw/ || true

      - name: Create placeholder artifacts for tests
        run: |
          python - <<'PY'
          import os, joblib
          from sklearn.dummy import DummyClassifier
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.preprocessing import OneHotEncoder, StandardScaler

          os.makedirs('artifacts/models', exist_ok=True)
          os.makedirs('data/processed', exist_ok=True)

          model = DummyClassifier(strategy='most_frequent')
          model.fit([[0], [1]], [0, 1])
          joblib.dump(model, 'artifacts/models/best_linear_svm_calibrated.pkl')

          vec = TfidfVectorizer()
          vec.fit(['sample text'])
          joblib.dump(vec, 'artifacts/models/tfidf_vectorizer.pkl')

          enc = OneHotEncoder(handle_unknown='ignore', sparse_output=True)
          enc.fit([['unknown']])
          joblib.dump(enc, 'artifacts/models/category_encoder.pkl')

          scaler = StandardScaler()
          scaler.fit([[3.0]])
          joblib.dump(scaler, 'artifacts/models/rating_scaler.pkl')
          PY

      - name: Run Flake8
        run: |
          flake8 app src

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///./test.db' }}
        run: |
          pytest -v

      - name: Run InsightCart Training Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///./test.db' }}
          MLFLOW_TRACKING_URI: "file://${{ github.workspace }}/mlruns"
        run: |
          python src/pipeline/review_detection_training_pipeline.py

      - name: Show evaluation metrics
        run: |
          cat artifacts/evaluation_results.json

      - name: Show model comparison
        run: |
          cat data/processed/model_comparison.csv
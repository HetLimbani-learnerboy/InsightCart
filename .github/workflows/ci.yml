name: InsightCart CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'monitoring/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'monitoring/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
      MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
      MLFLOW_TRACING_ENABLED: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create local model fixtures for tests
        run: |
          python - <<'PY'
          import os, joblib
          from sklearn.dummy import DummyClassifier
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.preprocessing import OneHotEncoder, StandardScaler

          os.makedirs('artifacts/models', exist_ok=True)
          model = DummyClassifier(strategy='most_frequent')
          model.fit([[0], [1]], [0, 1])
          joblib.dump(model, 'artifacts/models/best_linear_svm_calibrated.pkl')

          vec = TfidfVectorizer()
          vec.fit(['sample text'])
          joblib.dump(vec, 'artifacts/models/tfidf_vectorizer.pkl')

          enc = OneHotEncoder(handle_unknown='ignore', sparse_output=True)
          enc.fit([['unknown']])
          joblib.dump(enc, 'artifacts/models/category_encoder.pkl')

          scaler = StandardScaler()
          scaler.fit([[3.0]])
          joblib.dump(scaler, 'artifacts/models/rating_scaler.pkl')
          PY

      - name: Run Flake8
        run: |
          flake8 app src tests

      - name: Run tests
        run: |
          pytest -q

      - name: Validate Docker Compose file
        run: |
          docker compose config --quiet

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        run: |
          docker build --tag insightcart-api:ci --cache-from type=gha --cache-to type=gha,mode=max .
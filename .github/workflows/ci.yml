name: InsightCart CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create placeholder artifacts for tests
        run: |
          python - <<'PY'
          import os, joblib
          from sklearn.dummy import DummyClassifier
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.preprocessing import OneHotEncoder, StandardScaler

          os.makedirs('artifacts/models', exist_ok=True)

          # Dummy model
          model = DummyClassifier(strategy='most_frequent')
          # fit on minimal data
          model.fit([[0], [1]], [0, 1])
          joblib.dump(model, 'artifacts/models/best_linear_svm_calibrated.pkl')

          # TF-IDF vectorizer
          vec = TfidfVectorizer()
          vec.fit(['sample text'])
          joblib.dump(vec, 'artifacts/models/tfidf_vectorizer.pkl')

          # Category encoder
          enc = OneHotEncoder(handle_unknown='ignore', sparse=True)
          enc.fit([['unknown']])
          joblib.dump(enc, 'artifacts/models/category_encoder.pkl')

          # Rating scaler
          scaler = StandardScaler()
          scaler.fit([[3.0]])
          joblib.dump(scaler, 'artifacts/models/rating_scaler.pkl')
          PY

      - name: Run Flake8
        run: |
          flake8 app src tests

      - name: Run tests
        run: |
          pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t insightcart-api:test .
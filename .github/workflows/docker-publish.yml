name: InsightCart Local Docker Build

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'monitoring/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'monitoring/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  local-docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        run: docker build --tag insightcart-api:local --cache-from type=gha --cache-to type=gha,mode=max .

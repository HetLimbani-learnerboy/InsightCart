
name: InsightCart Docker Publish

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "artifacts/**"
      - "config/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "setup.py"
      - "docker-compose.yml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insightcart-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Restore DVC model artifacts
        run: |
          python -m pip install "dvc[s3]"
          dvc pull \
            artifacts/models/best_linear_svm_calibrated.pkl.dvc \
            artifacts/models/category_encoder.pkl.dvc \
            artifacts/models/tfidf_vectorizer.pkl.dvc

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/insightcart-api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/insightcart-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

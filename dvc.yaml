stages:
  train_candidate:
    cmd: python src/pipeline/run_v2_experiment.py --dataset data/raw/fake_reviews_dataset.csv --output-dir artifacts/experiments/dvc-candidate --seed 42
    deps:
      - data/raw/fake_reviews_dataset.csv
      - requirements.txt
      - src/components/data_ingestion.py
      - src/components/data_validation.py
      - src/components/data_transformation.py
      - src/components/model_trainer.py
      - src/components/model_evaluation.py
      - src/evaluation/evaluate_models.py
      - src/evaluation/model_gate.py
      - src/pipeline/run_v2_experiment.py
      - src/constants.py
      - src/utils/preprocessing.py
      - src/utils/common.py
      - artifacts/models/best_linear_svm_calibrated.pkl
      - artifacts/models/tfidf_vectorizer.pkl
      - artifacts/models/category_encoder.pkl
      - artifacts/models/rating_scaler.pkl
    outs:
      - artifacts/experiments/dvc-candidate